name: Build KilzzTemp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set minSdkVersion (Android 5.0+)
        run: |
          sed -i 's/minSdkVersion=[0-9]*/minSdkVersion=21/' android/variables.gradle

      - name: Generate app icon & splash from logo
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Rename app label to KilzzTemp
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">KilzzTemp<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">KilzzTemp<\/string>/' android/app/src/main/res/values/strings.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KilzzTemp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
